name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the release step on v* tags

jobs:
  build:
    name: Build (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Verify the exe only imports system DLLs
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "tokens=*" %%i in ('"!VSWHERE!" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul 2>nul
          dumpbin /nologo /dependents build\mhide.exe
          dumpbin /nologo /dependents build\mhide.exe | findstr /i "vcruntime msvcp api-ms-win-crt ucrtbase" >nul && (
            echo ERROR: mhide.exe depends on a CRT runtime DLL. It must be statically linked.
            exit /b 1
          )
          exit /b 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhide-${{ github.sha }}
          path: build/mhide.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release on first run; on a re-tagged version replace the exe in place.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing mhide.exe"
            gh release upload $tag build/mhide.exe --clobber --repo $repo
          } else {
            gh release create $tag build/mhide.exe --repo $repo --title "mhide $tag" --generate-notes
          }
          exit $LASTEXITCODE
